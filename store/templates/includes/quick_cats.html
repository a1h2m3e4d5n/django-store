<style>
    .quick-cats-swiper {
        padding: 20px 0 40px; /* تم زيادة الهامش السفلي لضمان مساحة كافية للنص وشريط التمرير */
        background: #fff;
    }

    .quick-cat-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100px; /* الحاوية الأساسية لكل قسم */
        margin: 0 auto;
        padding: 5px;
    }

    .quick-cat-img-container {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px; /* هامش متناسق بين حدود الصورة والاسم */
        transition: transform 0.3s ease;
        padding: 5px;
    }

    .quick-cat-img-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }

    /* إصلاح وتنسيق كلاس الاسم لضمان ظهوره بشكل صريح وواضح */
    .quick-cat-text {
        font-size: 12px !important;
        font-weight: 600 !important;
        color: #2b2b2b !important; /* لون داكن واضح جداً */
        text-align: center !important;
        margin: 0 !important;
        padding: 0 2px !important;
        display: -webkit-box !important;
        -webkit-line-clamp: 2; /* يسمح بظهور الاسم على سطرين إذا كان طويلاً بدلاً من قصه واختفائه */
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
    }

    /* تأثير تفاعلي عند تحريك الماوس فوق القسم */
    .quick-cat-wrapper:hover .quick-cat-img-container {
        transform: translateY(-4px);
    }
</style>
{% if block.title %}
<div class="mb-3 mt-4 px-2">
    <h5 class="fw-bold text-dark m-0">
        {% if block.icon_class %}
            <!-- تم دمج الأيقونة واللون هنا -->
            <i class="{{ block.icon_class }} {{ block.icon_color }} me-2"></i>
        {% endif %}
        {{ block.title }}
    </h5>
</div>
{% endif %}
<div class="swiper quick-cats-swiper">
    <div class="swiper-wrapper">
        {% for sub_cat in categories_list %}
        <div class="swiper-slide" style="width: auto;">
            <a href="{% url 'category_detail' sub_cat.id %}" class="text-decoration-none">
                <div class="quick-cat-wrapper">
                    <div class="quick-cat-img-container">
                        {% if sub_cat.image %}
                             <img src="{{ sub_cat.image.url }}" alt="{{ sub_cat.name }}">
                        {% else %}
                            <div class="bg-light rounded p-2 d-flex align-items-center justify-content-center" style="width: 100%; height: 100%;">
                                <i class="fa-solid fa-folder text-success fa-2x"></i>
                            </div>
                        {% endif %}
                    </div>
                    <p class="quick-cat-text">{{ sub_cat.name }}</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
    <div class="swiper-scrollbar"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (document.querySelector('.quick-cats-swiper')) {
            new Swiper('.quick-cats-swiper', {
                slidesPerView: 'auto',
                spaceBetween: 12,
                loop: false, /* إيقاف الـ loop لضمان استقرار العرض والأبعاد عند وجود أقسام قليلة */
                autoplay: { delay: 3500, disableOnInteraction: false },
                freeMode: true,
                grabCursor: true,
                scrollbar: {
                    el: '.quick-cats-swiper .swiper-scrollbar',
                    hide: true,
                    draggable: true,
                },
            });
        }
    });
</script>
