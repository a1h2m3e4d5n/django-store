services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in server .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - private

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in server .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in server .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in server .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  web:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in server .env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

volumes:
  postgres_data:
  media_data:
  backup_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
